<body>
    <div id="header">
        <div id="header-info">
            <span>🏴 Welcome to my terminal!</span>
            <span>|</span>
            <span>Anish Kumar A</span>
        </div>
        <div id="system-time">
            <span id="time-display">00:00:00</span>
        </div>
    </div>
    
    <div id="terminal-wrapper">
        <div id="terminal" onclick="$('texter').focus();">
            <div id="history">
                <a id="before"></a>
            </div>
            <div id="input-line">
                <span class="prompt-label">anish@portfolio ~ $</span>
                <span id="typer"></span><b class="cursor" id="cursor">█</b>
            </div>
            <textarea type="text" id="texter" onkeyup="typeIt(this, event)" onkeydown="typeIt(this, event); moveIt(this.value.length, event)" onkeypress="typeIt(this, event);" autofocus></textarea>
            <div id="autocomplete" class="hidden"></div>
        </div>
    </div>
    <script src="js/cursor.js"></script>
    <script src="js/commands.js"></script>
    <script src="js/main.js"></script>
