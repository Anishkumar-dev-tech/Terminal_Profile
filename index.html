<body>
    <div id="header">
        <div id="header-info">
            <span>🏴 Welcome to my terminal!</span>
            <span>|</span>
            <span>Anish Kumar A</span>
        </div>
        <div id="system-time">

    <div id="command-container">
        <div id="terminal-wrapper">
            <div id="terminal">
                <a id="before"></a>
            </div>
        </div>
        
        <div id="command" onclick="$('texter').focus();">
            <textarea type="text" id="texter" onkeyup="typeIt(this, event)" onkeydown="typeIt(this, event); moveIt(this.value.length, event)" onkeypress="typeIt(this, event);" autofocus></textarea>
            <div id="liner">
                <span id="typer"></span><b class="cursor" id="cursor">█</b>
            </div>
            <div id="autocomplete" class="hidden"></div>
        </div>
    </div>
